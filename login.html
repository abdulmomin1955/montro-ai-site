<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Montro-AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  :root { --green:#1A5C45; --ink:#12241C; --bg:#F5F6F3; --muted:#55625B; --gold:#F5B94A; --line:#E3E7E1; --mint:#E4EFE9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; font-size:17px; line-height:1.55; min-height:100vh; display:flex; flex-direction:column; }
  .nav { padding:18px 32px; border-bottom:1px solid var(--line); background:#fff; }
  .logo { display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:var(--green); font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:24px; }
  .mark { width:30px; height:30px; border-radius:8px 8px 8px 2px; background:var(--gold); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:17px; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:20px; padding:36px 32px; max-width:460px; width:100%; text-align:center; }
  h1 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:34px; line-height:1.1; margin:0 0 12px; }
  p { color:var(--muted); margin:0 0 22px; }
  .btn { display:inline-block; background:var(--green); color:#fff; padding:14px 26px; border-radius:999px; font-weight:600; text-decoration:none; min-height:48px; }
  .btn.ghost { background:transparent; color:var(--ink); border:1.5px solid var(--line); margin-left:8px; }
  .btn:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>
<div class="nav"><a class="logo" href="index.html"><span class="mark">M</span>Montro-AI</a></div>
<main>
  <div class="card">
    <h1>Log in is coming soon</h1>
    <p>The Montro-AI app is still being built. Want to see it first? Try the live demo, or ask us for a walkthrough.</p>
    <a class="btn" href="demo.html">Try the live demo</a><a class="btn ghost" href="index.html#contact">Get a demo</a>
  </div>
</main>
</body>
</html>
