<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montro — Product Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #12241C;
    --ink-2: #1D3A2D;
    --cream: #F5F6F3;
    --paper: #FFFFFF;
    --line: #E3E7E1;
    --copper: #1A5C45;
    --copper-dark: #134A38;
    --text: #12241C;
    --muted: #6B7280;
    --green: #2E7D4F;
    --red: #B2472B;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--cream);
    color: var(--text);
    display: flex;
    overflow-x: hidden;
  }
  .display { font-family: 'Bricolage Grotesque', sans-serif; }

  /* Sidebar */
  #sidebar {
    width: 232px;
    flex-shrink: 0;
    background: var(--ink);
    color: #F7F4EC;
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    gap: 4px;
    min-height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 22px 10px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 8px 8px 8px 2px; background: #F5B94A; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--ink); flex-shrink: 0; }
  .brand-name { font-size: 17px; font-weight: 600; }
  .navbtn {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px; border-radius: 8px; border: none; background: transparent;
    color: #C7CCD6; font-size: 14.5px; font-weight: 500; cursor: pointer; text-align: left;
    width: 100%; font-family: inherit;
  }
  .navbtn:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .navbtn.active { background: rgba(245,185,74,0.22); color: #fff; }
  .navbtn svg { flex-shrink: 0; }
  .store-picker {
    margin-top: auto; padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.06);
    font-size: 12.5px; color: #93A0B4;
  }
  .store-picker select {
    width: 100%; margin-top: 6px; background: var(--ink-2); color: #fff; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; padding: 7px 8px; font-size: 13px; font-family: inherit;
  }

  /* Main */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px; border-bottom: 1px solid var(--line); background: var(--paper);
  }
  #topbar h1 { margin: 0; font-size: 21px; font-weight: 600; }
  .pill { font-size: 12.5px; padding: 5px 11px; border-radius: 999px; background: #EAF5EE; color: var(--green); font-weight: 600; }
  #content { padding: 28px 32px 60px 32px; overflow-y: auto; }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .grid { display: grid; gap: 18px; }
  .cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .cols-2 { grid-template-columns: 1.3fr 1fr; }
  @media (max-width: 900px) { .cols-4, .cols-3, .cols-2 { grid-template-columns: 1fr; } }

  .stat-label { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); }
  .stat-value { font-family: 'Bricolage Grotesque', sans-serif; font-size: 27px; margin-top: 8px; }
  .stat-delta { font-size: 12.5px; margin-top: 6px; font-weight: 600; }
  .up { color: var(--green); } .down { color: var(--red); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 11px 10px; border-bottom: 1px solid #EEF1EC; }
  tr:last-child td { border-bottom: none; }
  .tag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .tag.ok { background: #EAF5EE; color: var(--green); }
  .tag.low { background: #FDECE7; color: var(--red); }
  .tag.mid { background: #FBEFD2; color: #97650E; }

  button.primary { background: var(--copper); color: #fff; border: none; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; }
  button.primary:hover { background: var(--copper-dark); }
  button.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--text); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; }
  button.ghost:hover { border-color: var(--copper); }
  input[type=text], input[type=search] { padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--copper); outline-offset: 1px; }
  label { font-size: 13px; font-weight: 600; color: var(--muted); }

  /* POS view */
  .pos-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  @media (max-width: 900px) { .pos-grid { grid-template-columns: 1fr; } }
  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .item-btn {
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 12px;
    cursor: pointer; text-align: left; font-family: inherit; display: flex; flex-direction: column; gap: 6px; min-height: 44px;
  }
  .item-btn:hover { border-color: var(--copper); }
  .item-name { font-size: 13.5px; font-weight: 600; }
  .item-price { font-size: 13px; color: var(--muted); }
  .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #EEF1EC; font-size: 14px; }
  .qtybtn { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 14px; line-height: 1; }

  .barwrap { height: 8px; border-radius: 999px; background: #EEF1EC; overflow: hidden; flex: 1; }
  .bar { height: 100%; background: var(--copper); }

  .bell { position: relative; }
  h2.section { margin: 0 0 14px 0; font-size: 15px; font-weight: 600; }
  .muted { color: var(--muted); }
</style>
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <div class="brand-mark display">M</div>
    <div class="brand-name display">Montro</div>
  </div>
  <button class="navbtn" data-view="dashboard">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
    Dashboard
  </button>
  <button class="navbtn" data-view="pos">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="M6 6V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"></path><path d="M6 12h4"></path></svg>
    Point of Sale
  </button>
  <button class="navbtn" data-view="inventory">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8L12 3 3 8l9 5 9-5Z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg>
    Inventory
  </button>
  <button class="navbtn" data-view="insights">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"></path><path d="M7 15l4-5 3 3 5-7"></path></svg>
    Insights
  </button>
  <button class="navbtn" data-view="team">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><circle cx="18" cy="8" r="3"></circle><path d="M16 12.2a5.5 5.5 0 0 1 5.5 5.5"></path></svg>
    Team
  </button>

  <div class="store-picker">
    Viewing location
    <select id="storeSelect">
      <option>Main St — Convenience</option>
      <option>Riverside — Full Service</option>
      <option>Airport Rd — Café</option>
    </select>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <h1 id="pageTitle" class="display">Dashboard</h1>
    <div style="display:flex; align-items:center; gap: 14px;">
      <span class="pill">● All systems live</span>
      <div style="width:32px;height:32px;border-radius:50%;background:#E4EFE9;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1A5C45;">JM</div>
    </div>
  </div>
  <div id="content"></div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Demo data (in-memory only) ---------- */
  var inventory = [
    { name: "Fountain Drink 32oz", cat: "Beverages", stock: 214, par: 120, status: "ok" },
    { name: "Premium Roast Coffee", cat: "Beverages", stock: 18, par: 40, status: "low" },
    { name: "Breakfast Sandwich", cat: "Hot Food", stock: 32, par: 50, status: "mid" },
    { name: "Energy Drink 16oz", cat: "Beverages", stock: 96, par: 60, status: "ok" },
    { name: "Bottled Water 20oz", cat: "Beverages", stock: 7, par: 80, status: "low" },
    { name: "Bagged Ice 7lb", cat: "General", stock: 55, par: 40, status: "ok" },
    { name: "House Blend Draft", cat: "Bar", stock: 21, par: 25, status: "mid" },
    { name: "Lottery Scratch - $5", cat: "Lottery", stock: 140, par: 100, status: "ok" }
  ];

  var team = [
    { name: "Jordan Marsh", role: "Store Manager", shift: "6a – 2p", status: "Clocked in" },
    { name: "Priya Anand", role: "Cashier", shift: "2p – 10p", status: "Scheduled" },
    { name: "Deshawn Little", role: "Kitchen Lead", shift: "6a – 2p", status: "Clocked in" },
    { name: "Casey Nguyen", role: "Cashier", shift: "10a – 6p", status: "On break" }
  ];

  var posItems = [
    { name: "Fountain Drink", price: 2.19 },
    { name: "Coffee, Large", price: 2.89 },
    { name: "Breakfast Sandwich", price: 4.49 },
    { name: "Energy Drink", price: 3.29 },
    { name: "Bottled Water", price: 1.79 },
    { name: "Bag of Chips", price: 2.49 },
    { name: "Hot Dog", price: 2.99 },
    { name: "Candy Bar", price: 1.99 },
    { name: "Scratch Ticket $5", price: 5.00 },
    { name: "Ice, 7lb Bag", price: 3.49 },
    { name: "Cigarettes, Pack", price: 8.75 },
    { name: "Draft Beer, Pint", price: 5.50 }
  ];

  var cart = []; // {name, price, qty}

  var salesByHour = [12, 18, 22, 31, 44, 52, 61, 58, 47, 39, 33, 21]; // relative bars

  /* ---------- View router ---------- */
  var titles = {
    dashboard: "Dashboard",
    pos: "Point of Sale",
    inventory: "Inventory",
    insights: "Insights",
    team: "Team"
  };

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function money(n) { return "$" + n.toFixed(2); }

  function render(view) {
    document.getElementById("pageTitle").textContent = titles[view];
    document.querySelectorAll(".navbtn").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-view") === view);
    });
    var el = document.getElementById("content");
    if (view === "dashboard") el.innerHTML = dashboardHTML();
    if (view === "pos") { el.innerHTML = posHTML(); wirePOS(); }
    if (view === "inventory") el.innerHTML = inventoryHTML();
    if (view === "insights") el.innerHTML = insightsHTML();
    if (view === "team") el.innerHTML = teamHTML();
    if (view === "inventory") wireInventorySearch();
  }

  /* ---------- Dashboard ---------- */
  function dashboardHTML() {
    var maxBar = Math.max.apply(null, salesByHour);
    var bars = salesByHour.map(function (v, i) {
      var h = Math.round((v / maxBar) * 100);
      return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;">' +
        '<div style="width:100%;height:110px;display:flex;align-items:flex-end;">' +
        '<div style="width:100%;height:' + h + '%;background:var(--copper);border-radius:4px 4px 0 0;"></div></div>' +
        '<div style="font-size:10.5px;color:var(--muted);">' + (i + 6) + '</div></div>';
    }).join("");

    var lowStock = inventory.filter(function (i) { return i.status === "low"; });

    return (
      '<div class="grid cols-4" style="margin-bottom:18px;">' +
        statCard("Net Sales Today", "$8,412", "+6.4% vs last Tue", true) +
        statCard("Transactions", "612", "+2.1%", true) +
        statCard("Avg. Margin", "28.6%", "-0.8pt", false) +
        statCard("Shrink Flags", "2 items", "needs review", false) +
      '</div>' +
      '<div class="grid cols-2">' +
        '<div class="card">' +
          '<h2 class="section">Sales by hour</h2>' +
          '<div style="display:flex;gap:6px;align-items:flex-end;">' + bars + '</div>' +
        '</div>' +
        '<div class="card">' +
          '<h2 class="section">Needs attention</h2>' +
          (lowStock.length ? lowStock.map(function (i) {
            return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #EEF1EC;font-size:14px;">' +
              '<div>' + esc(i.name) + '<div class="muted" style="font-size:12px;">' + esc(i.cat) + '</div></div>' +
              '<span class="tag low">Reorder</span></div>';
          }).join("") : '<div class="muted" style="font-size:14px;">Nothing needs attention right now.</div>') +
        '</div>' +
      '</div>'
    );
  }

  function statCard(label, value, delta, positive) {
    return '<div class="card"><div class="stat-label">' + esc(label) + '</div>' +
      '<div class="stat-value display">' + esc(value) + '</div>' +
      '<div class="stat-delta ' + (positive ? "up" : "down") + '">' + esc(delta) + '</div></div>';
  }

  /* ---------- POS ---------- */
  function posHTML() {
    return (
      '<div class="pos-grid">' +
        '<div>' +
          '<h2 class="section">Menu</h2>' +
          '<div class="item-grid" id="itemGrid">' +
            posItems.map(function (it, idx) {
              return '<button class="item-btn" data-idx="' + idx + '">' +
                '<div class="item-name">' + esc(it.name) + '</div>' +
                '<div class="item-price">' + money(it.price) + '</div></button>';
            }).join("") +
          '</div>' +
        '</div>' +
        '<div class="card" style="height:fit-content;">' +
          '<h2 class="section">Current Order</h2>' +
          '<div id="cartList"></div>' +
          '<div style="display:flex;justify-content:space-between;padding-top:14px;margin-top:6px;border-top:1.5px solid var(--line);font-weight:600;">' +
            '<span>Total</span><span id="cartTotal" class="display" style="font-size:18px;">$0.00</span>' +
          '</div>' +
          '<button class="primary" id="chargeBtn" style="width:100%;margin-top:14px;">Charge</button>' +
          '<button class="ghost" id="clearBtn" style="width:100%;margin-top:8px;">Clear Order</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderCart() {
    var list = document.getElementById("cartList");
    var totalEl = document.getElementById("cartTotal");
    if (!list) return;
    if (cart.length === 0) {
      list.innerHTML = '<div class="muted" style="font-size:13.5px;padding:10px 0;">No items yet — tap the menu to add.</div>';
    } else {
      list.innerHTML = cart.map(function (c, idx) {
        return '<div class="cart-row"><div>' + esc(c.name) + '<div class="muted" style="font-size:12px;">' + money(c.price) + ' each</div></div>' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
          '<button class="qtybtn" data-act="dec" data-idx="' + idx + '">−</button>' +
          '<span style="min-width:16px;text-align:center;">' + c.qty + '</span>' +
          '<button class="qtybtn" data-act="inc" data-idx="' + idx + '">+</button>' +
          '<span style="min-width:56px;text-align:right;font-weight:600;">' + money(c.price * c.qty) + '</span>' +
          '</div></div>';
      }).join("");
    }
    var total = cart.reduce(function (s, c) { return s + c.price * c.qty; }, 0);
    totalEl.textContent = money(total);
  }

  function wirePOS() {
    cart = [];
    renderCart();
    document.getElementById("itemGrid").addEventListener("click", function (e) {
      var btn = e.target.closest(".item-btn");
      if (!btn) return;
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var item = posItems[idx];
      var existing = cart.find(function (c) { return c.name === item.name; });
      if (existing) existing.qty += 1;
      else cart.push({ name: item.name, price: item.price, qty: 1 });
      renderCart();
    });
    document.getElementById("cartList").addEventListener("click", function (e) {
      var btn = e.target.closest(".qtybtn");
      if (!btn) return;
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var act = btn.getAttribute("data-act");
      if (act === "inc") cart[idx].qty += 1;
      if (act === "dec") { cart[idx].qty -= 1; if (cart[idx].qty <= 0) cart.splice(idx, 1); }
      renderCart();
    });
    document.getElementById("clearBtn").addEventListener("click", function () {
      cart = []; renderCart();
    });
    document.getElementById("chargeBtn").addEventListener("click", function () {
      if (cart.length === 0) return;
      var total = cart.reduce(function (s, c) { return s + c.price * c.qty; }, 0);
      alert("Demo only — would charge " + money(total) + " and print a receipt.");
      cart = []; renderCart();
    });
  }

  /* ---------- Inventory ---------- */
  function inventoryRows(list) {
    return list.map(function (i) {
      var tagClass = i.status === "ok" ? "ok" : (i.status === "low" ? "low" : "mid");
      var tagText = i.status === "ok" ? "In stock" : (i.status === "low" ? "Reorder now" : "Watch");
      var pct = Math.min(100, Math.round((i.stock / (i.par * 1.4)) * 100));
      return '<tr><td>' + esc(i.name) + '</td><td class="muted">' + esc(i.cat) + '</td>' +
        '<td>' + i.stock + ' / ' + i.par + ' par' +
        '<div class="barwrap" style="margin-top:6px;"><div class="bar" style="width:' + pct + '%;"></div></div></td>' +
        '<td><span class="tag ' + tagClass + '">' + tagText + '</span></td></tr>';
    }).join("");
  }

  function inventoryHTML() {
    return (
      '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;">' +
          '<h2 class="section" style="margin:0;">Price Book &amp; Stock</h2>' +
          '<div style="width:240px;"><input type="search" id="invSearch" placeholder="Search items…"></div>' +
        '</div>' +
        '<table><thead><tr><th>Item</th><th>Category</th><th>Stock vs. Par</th><th>Status</th></tr></thead>' +
        '<tbody id="invBody">' + inventoryRows(inventory) + '</tbody></table>' +
      '</div>'
    );
  }

  function wireInventorySearch() {
    var input = document.getElementById("invSearch");
    if (!input) return;
    input.addEventListener("input", function () {
      var q = input.value.toLowerCase();
      var filtered = inventory.filter(function (i) {
        return i.name.toLowerCase().indexOf(q) !== -1 || i.cat.toLowerCase().indexOf(q) !== -1;
      });
      document.getElementById("invBody").innerHTML = inventoryRows(filtered);
    });
  }

  /* ---------- Insights ---------- */
  function insightsHTML() {
    var categories = [
      { name: "Beverages", pct: 82 },
      { name: "Hot Food", pct: 64 },
      { name: "Tobacco", pct: 41 },
      { name: "Lottery", pct: 57 },
      { name: "General Merch", pct: 33 }
    ];
    return (
      '<div class="grid cols-2">' +
        '<div class="card">' +
          '<h2 class="section">Category performance (7-day)</h2>' +
          categories.map(function (c) {
            return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">' +
              '<div style="width:120px;font-size:13.5px;">' + esc(c.name) + '</div>' +
              '<div class="barwrap"><div class="bar" style="width:' + c.pct + '%;"></div></div>' +
              '<div style="width:34px;text-align:right;font-size:13px;color:var(--muted);">' + c.pct + '%</div>' +
            '</div>';
          }).join("") +
        '</div>' +
        '<div class="card">' +
          '<h2 class="section">Margin trend</h2>' +
          '<p class="muted" style="font-size:14px;line-height:1.6;margin-top:0;">Margin has held steady around 28–29% over the past week, with Tuesday\'s dip tied to a beverage promo. Full trend charts and export are available in the live product.</p>' +
          '<div style="display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:12px;">' +
            [26,28,27,24,29,30,28].map(function (v) {
              var h = Math.round((v / 32) * 100);
              return '<div style="flex:1;height:100%;display:flex;align-items:flex-end;"><div style="width:100%;height:' + h + '%;background:#E4EFE9;border-radius:3px 3px 0 0;"></div></div>';
            }).join("") +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  /* ---------- Team ---------- */
  function teamHTML() {
    return (
      '<div class="card">' +
        '<h2 class="section">Today\'s Schedule</h2>' +
        '<table><thead><tr><th>Name</th><th>Role</th><th>Shift</th><th>Status</th></tr></thead><tbody>' +
        team.map(function (t) {
          var cls = t.status === "Clocked in" ? "ok" : (t.status === "On break" ? "mid" : "low");
          return '<tr><td>' + esc(t.name) + '</td><td class="muted">' + esc(t.role) + '</td><td>' + esc(t.shift) + '</td>' +
            '<td><span class="tag ' + cls + '">' + esc(t.status) + '</span></td></tr>';
        }).join("") +
        '</tbody></table>' +
      '</div>'
    );
  }

  /* ---------- Init ---------- */
  document.querySelectorAll(".navbtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      render(btn.getAttribute("data-view"));
    });
  });

  render("dashboard");
})();
</script>
</body>
</html>
